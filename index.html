<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的文字空间</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Microsoft YaHei",sans-serif;
}

body{

    margin:0;
    min-height:100vh;

    background:
    linear-gradient(
    rgba(20,20,80,.25),
    rgba(30,10,80,.5)
    ),
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")
    center/cover fixed;

    color:white;

}


/* 顶部 */

.header{

    text-align:center;
    padding-top:70px;

}


.header h1{

    font-size:55px;
    margin:0;

    letter-spacing:5px;

    text-shadow:
    0 0 20px #fff,
    0 0 40px #8b7cff;

}


.header p{

    font-size:18px;
    opacity:.9;

}



/* 状态 */

.status{

position:absolute;
right:40px;
top:30px;

background:rgba(255,255,255,.2);
backdrop-filter:blur(20px);

padding:12px 25px;

border-radius:50px;

}


/* 主卡片 */

.container{

width:850px;
max-width:90%;

margin:50px auto;

}


/* 毛玻璃 */

.card{

background:

rgba(255,255,255,.18);


border:

1px solid rgba(255,255,255,.35);


backdrop-filter:

blur(25px);


border-radius:35px;


padding:35px;


box-shadow:

0 20px 60px rgba(0,0,0,.3);

}



/* 输入 */

input,textarea{


width:100%;


background:

rgba(255,255,255,.25);


border:

1px solid rgba(255,255,255,.4);


padding:20px;


border-radius:20px;


font-size:18px;


color:white;


outline:none;


margin-bottom:20px;


}


textarea{

height:180px;

resize:none;

}



input::placeholder,
textarea::placeholder{

color:#eee;

}



/* 按钮 */


button{


width:100%;


border:none;


padding:18px;


border-radius:25px;


font-size:20px;


color:white;


cursor:pointer;


background:

linear-gradient(
90deg,
#8d5cff,
#36d1ff
);



box-shadow:

0 0 30px #55c8ff;


}



/* 记录 */

.records{

margin-top:35px;

}



.item{


background:

rgba(255,255,255,.18);


border-radius:20px;


padding:20px;


margin-top:15px;


border-left:5px solid #8bdcff;


}



.item h3{

margin:0 0 10px;

}



.time{

float:right;

opacity:.7;

font-size:14px;

}


</style>

</head>


<body>


<div class="status">
☁ 已连接数据库
</div>



<div class="header">


<h1>✍ 我的文字空间</h1>


<p>
记录想法 · 收藏灵感 · 留住重要的瞬间
</p>


</div>



<div class="container">


<div class="card">


<input id="title"
placeholder="请输入标题">


<textarea id="content"
placeholder="写下你想记录的内容……">
</textarea>


<button onclick="save()">
💾 保存
</button>


</div>



<div class="card records">


<h2>
📚 我的记录
</h2>


<div id="list">

</div>


</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://nrpedfcezmvrrjhfihy.supabase.co";


const SUPABASE_KEY =
"sb_publishable_M9eL0D5OIW_NpOYkm8NaLw_d-o7bKHA";


const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function save(){


let title =
document.getElementById("title").value;


let content =
document.getElementById("content").value;



await supabase
.from("FIRST TRY")
.insert({

title:title,
content:content

});


alert("保存成功 ✨");


load();


}



async function load(){


let {data}=await supabase
.from("FIRST TRY")
.select("*")
.order("created_at",
{ascending:false});



let html="";


data.forEach(x=>{


html+=`

<div class="item">

<h3>
${x.title}

<span class="time">
${new Date(x.created_at)
.toLocaleString()}
</span>

</h3>


<p>
${x.content}
</p>


</div>


`;


});



document.getElementById("list")
.innerHTML=html;


}


load();


</script>


</body>
</html>
