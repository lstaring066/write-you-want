<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的文字空间</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      height: 180px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .note {
      border-top: 1px solid #eee;
      padding: 20px 0;
    }

    .note h3 {
      margin: 0 0 8px;
    }

    .date {
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .content {
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>✍️ 我的文字空间</h1>

    <div class="card">

      <input
        id="title"
        type="text"
        placeholder="请输入标题"
      >

      <textarea
        id="content"
        placeholder="写下你想记录的内容……"
      ></textarea>

      <button onclick="saveNote()">
        💾 保存
      </button>

    </div>

    <div class="card">

      <h2>📚 我的记录</h2>

      <div id="notes">
        暂时还没有记录。
      </div>

    </div>

  </div>

  <script>

    function saveNote() {

      const title =
        document.getElementById("title").value;

      const content =
        document.getElementById("content").value;

      if (!title || !content) {
        alert("请填写标题和内容！");
        return;
      }

      alert("这是一版测试页面，下一步我们会把内容真正保存到 Supabase！");

    }

  </script>

</body>
</html>
