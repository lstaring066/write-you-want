<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的文字空间</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    padding:40px 20px;
}


.container{
    max-width:850px;
    margin:auto;
}


h1{
    color:white;
    text-align:center;
    font-size:42px;
    margin-bottom:40px;
}


.card{

    background:white;

    border-radius:28px;

    padding:35px;

    margin-bottom:30px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.15);
}


input,textarea{

    width:100%;

    border:1px solid #ddd;

    border-radius:16px;

    padding:18px;

    font-size:18px;

    outline:none;

    margin-bottom:20px;

}


textarea{

    height:180px;

    resize:none;

}


button{

    width:100%;

    border:none;

    padding:18px;

    border-radius:18px;

    background:#667eea;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:translateY(-3px);

}


.record{

    padding:20px;

    border-radius:18px;

    background:#f7f7fb;

    margin-top:15px;

}


.record h3{

    margin:0 0 10px;

}


.time{

    color:#999;

    font-size:13px;

}

</style>

</head>


<body>


<div class="container">


<h1>✍️ 我的文字空间</h1>



<div class="card">


<input 
id="title"
placeholder="请输入标题">


<textarea
id="content"
placeholder="写下你想记录的内容……">
</textarea>


<button onclick="saveText()">

💾 保存

</button>


</div>



<div class="card">


<h2>📚 我的记录</h2>


<div id="records">

加载中...

</div>


</div>



</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ===== Supabase 配置 =====


const supabaseUrl =
"https://nrpedfcezmvrrjhhfihy.supabase.co";


const supabaseKey =
"sb_publishable_M9eL0D5OIW_NpOYkm8NaLw_d-o7bKHA";



const client =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);



console.log("Supabase连接成功");



// 保存文章

async function saveText(){


    const title =
    document.getElementById("title").value;


    const content =
    document.getElementById("content").value;



    if(!title || !content){

        alert("请填写标题和内容");

        return;

    }



    const {error} =
    await client
    .from("FIRST TRY")
    .insert({

        title:title,

        content:content

    });



    if(error){

        alert(error.message);

        console.log(error);

    }

    else{

        alert("保存成功");

        document.getElementById("title").value="";

        document.getElementById("content").value="";

        loadTexts();

    }


}




// 读取文章


async function loadTexts(){


const {data,error}=

await client

.from("FIRST TRY")

.select("*")

.order(
"created_at",
{
ascending:false
}
);



if(error){

console.log(error);

return;

}



let html="";



if(data.length===0){

html="暂时还没有记录";

}

else{


data.forEach(item=>{


html += `


<div class="record">


<h3>
${item.title}
</h3>


<p>
${item.content}
</p>


<div class="time">

${item.created_at}

</div>


</div>


`;


});


}



document.getElementById("records").innerHTML=html;


}



loadTexts();



</script>


</body>

</html>
