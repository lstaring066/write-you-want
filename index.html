<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的文字空间</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Microsoft YaHei",sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    color:white;

    background:
    linear-gradient(
        rgba(10,25,55,.45),
        rgba(20,20,50,.65)
    ),
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee")
    center/cover fixed;
}


/* 顶部 */

.header{
    text-align:center;
    padding-top:70px;
}

.header h1{
    font-size:52px;
    letter-spacing:8px;
    margin:0;
    text-shadow:0 5px 30px rgba(255,255,255,.5);
}

.header p{
    margin-top:20px;
    font-size:18px;
    opacity:.8;
}



/* 主卡片 */

.container{

    width:720px;
    max-width:90%;

    margin:50px auto;

    background:
    rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border:
    1px solid rgba(255,255,255,.25);

    border-radius:30px;

    padding:35px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.35);
}



input,textarea{

    width:100%;

    background:
    rgba(255,255,255,.15);

    border:
    1px solid rgba(255,255,255,.35);

    border-radius:18px;

    padding:18px;

    margin-bottom:20px;

    color:white;

    font-size:17px;

    outline:none;

}


input::placeholder,
textarea::placeholder{

    color:rgba(255,255,255,.75);

}


textarea{

    height:180px;

    resize:none;

}


/* 按钮 */

button{

    width:100%;

    padding:18px;

    border:none;

    border-radius:20px;

    font-size:20px;

    color:white;

    cursor:pointer;


    background:
    linear-gradient(
    135deg,
    #8b7cff,
    #4da8ff
    );


    box-shadow:
    0 10px 30px rgba(80,120,255,.5);

}


button:hover{

    transform:translateY(-3px);

}


/* 记录 */

.records{

    margin-top:40px;

}


.record-card{

    background:
    rgba(255,255,255,.13);

    backdrop-filter:blur(15px);

    padding:25px;

    border-radius:25px;

    margin-top:20px;

}


.record-card h3{

    margin-top:0;

}



.time{

    opacity:.7;

    font-size:14px;

}



@media(max-width:700px){

.header h1{

font-size:35px;

}

}


</style>

</head>


<body>


<div class="header">

<h1>✒️ 我的文字空间</h1>

<p>
记录想法 · 收藏灵感 · 留住重要的瞬间
</p>

</div>



<div class="container">


<input
id="title"
placeholder="请输入标题"
/>


<textarea
id="content"
placeholder="写下你想记录的内容……">
</textarea>


<button onclick="save()">

💾 保存

</button>



<div class="records">

<h2>
📚 我的记录
</h2>


<div id="list">

<p>
暂无记录
</p>

</div>


</div>


</div>



<script>


function save(){

let title=
document.getElementById("title").value;


let content=
document.getElementById("content").value;



if(!title || !content){

alert("请填写完整");

return;

}



let time=
new Date().toLocaleString();



let html=`

<div class="record-card">

<h3>
${title}
</h3>

<p>
${content}
</p>

<div class="time">

${time}

</div>

</div>

`;



document.getElementById("list").innerHTML=
html+
document.getElementById("list").innerHTML;



document.getElementById("title").value="";
document.getElementById("content").value="";


}



</script>


</body>

</html>
